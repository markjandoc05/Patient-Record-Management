name: vine-local-development

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vine_development
      POSTGRES_USER: vine_dev
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run dev:setup first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vine_dev -d vine_development"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
